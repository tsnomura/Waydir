name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and vendor waydir_core
        shell: pwsh
        run: scripts\build_waydir_core_windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')" >> $GITHUB_OUTPUT

      - name: Personal build defines
        shell: bash
        run: |
          label="${GITHUB_REF_NAME//\//-}"
          echo "PERSONAL_LABEL=${label#v}" >> "$GITHUB_ENV"
          printf '{"WAYDIR_PERSONAL_VERSION":"%s","WAYDIR_PERSONAL_BRANCH":"release","WAYDIR_PERSONAL_COMMIT":"%s","WAYDIR_PERSONAL_BUILD_DATE":"%s"}\n' \
            "$label" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > personal_defines.json
          cat personal_defines.json

      - name: Build Windows release
        run: flutter build windows --release --dart-define-from-file=personal_defines.json

      - name: Include preview generator setup guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\docs | Out-Null
          Copy-Item docs\generators.md build\windows\x64\runner\Release\docs\generators.md

      - name: Package exe + zip via fastforge
        shell: pwsh
        run: |
          $env:Path += ";$env:LOCALAPPDATA\Pub\Cache\bin;C:\Program Files (x86)\Inno Setup 6"
          $defines = (Get-Content personal_defines.json -Raw | ConvertFrom-Json).PSObject.Properties |
            ForEach-Object { "--build-dart-define=$($_.Name)=$($_.Value)" }
          fastforge package --platform windows --targets exe,zip --skip-clean @defines

      - name: Name artifacts after the release
        shell: pwsh
        run: |
          $pubspec = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name.Contains($pubspec) } |
            ForEach-Object { Rename-Item $_.FullName $_.Name.Replace($pubspec, $env:PERSONAL_LABEL) }
          Get-ChildItem dist -Recurse -File | Select-Object -ExpandProperty Name

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: dist/**/*

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and vendor waydir_core
        run: scripts/build_waydir_core.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Personal build defines
        run: |
          label="${GITHUB_REF_NAME//\//-}"
          echo "PERSONAL_LABEL=${label#v}" >> "$GITHUB_ENV"
          printf '{"WAYDIR_PERSONAL_VERSION":"%s","WAYDIR_PERSONAL_BRANCH":"release","WAYDIR_PERSONAL_COMMIT":"%s","WAYDIR_PERSONAL_BUILD_DATE":"%s"}\n' \
            "$label" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > personal_defines.json
          cat personal_defines.json

      - name: Build Linux release
        run: flutter build linux --release --dart-define-from-file=personal_defines.json

      - name: Package bundle
        run: |
          mkdir -p build/linux/x64/release/bundle/docs
          cp docs/generators.md build/linux/x64/release/bundle/docs/generators.md
          mkdir -p dist
          tar -C build/linux/x64/release -czf \
            "dist/waydir-${PERSONAL_LABEL}-linux-x64.tar.gz" \
            --transform 's,^bundle,waydir,' bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: dist/**/*

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" \) \
            -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $version" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
