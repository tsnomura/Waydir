name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and vendor waydir_core
        shell: pwsh
        run: scripts\build_waydir_core_windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')" >> $GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release

      - name: Include preview generator setup guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\docs | Out-Null
          Copy-Item docs\generators.md build\windows\x64\runner\Release\docs\generators.md

      - name: Package exe + zip via fastforge
        shell: pwsh
        run: |
          $env:Path += ";$env:LOCALAPPDATA\Pub\Cache\bin;C:\Program Files (x86)\Inno Setup 6"
          fastforge package --platform windows --targets exe,zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: dist/**/*

  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" \) \
            -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $version" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
